# Daily: cluster new user feedback and open playbook PRs. Secrets reach only the digest step.
name: Feedback digest
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the qualifying clusters; change nothing
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency: feedback-digest

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # On schedule and workflow_dispatch the ref is a branch, so checkout leaves HEAD attached to it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      # Claude runs on a subscription login (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`), not an API key.
      - run: npm install -g @anthropic-ai/claude-code@2.1.319
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python -m pipeline feedback-digest ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEEDBACK_DB_ID: ${{ secrets.FEEDBACK_DB_ID }}
          GH_TOKEN: ${{ github.token }}
